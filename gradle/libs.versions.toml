[versions]
guava = "33.8.0-jre"
picocli = "4.7.7"
odf = "0.13.0"
ical4j = "4.4.0"
lombok = "1.18.48"
junit = "6.1.3"
assertj = "3.27.7"
shadow = "9.6.1"

[libraries]
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
picocli-codegen = { group = "info.picocli", name = "picocli-codegen", version.ref = "picocli" }
ical4j = { group = "org.mnode.ical4j", name = "ical4j", version.ref = "ical4j" }
odf = { group = "org.odftoolkit", name = "odfdom-java", version.ref = "odf" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
